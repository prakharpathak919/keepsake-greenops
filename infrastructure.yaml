AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Declarative GreenOps infrastructure for Keepsake Photo Journal.
  Provisions serverless on-demand storage (S3 + DynamoDB) and minimal ingress
  security rules to avoid idle compute and storage overhead.

Parameters:
  BucketName:
    Type: String
    Default: s3-project-green.ops
  TableName:
    Type: String
    Default: PhotoJournal

Resources:
  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  PhotoMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: photo_id
          AttributeType: S
      KeySchema:
        - AttributeName: photo_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AppSecurityGroup:
    Type: AWS::SecurityGroup
    Properties:
      GroupDescription: Minimal ingress security group for Keepsake Nginx reverse proxy
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
