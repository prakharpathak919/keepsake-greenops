name: Keepsake CI-CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  continuous-integration:
    name: CI - Lint, Security Audit, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate CloudFormation template syntax
        run: |
          python3 -c "
          import yaml
          class CFNLoader(yaml.SafeLoader): pass
          CFNLoader.add_multi_constructor('!', lambda loader, suffix, node: None)
          yaml.load(open('infrastructure.yaml'), Loader=CFNLoader)
          print('CloudFormation template syntax valid.')
          "

      - name: Run ESLint static code analysis
        run: npm run lint

      - name: Run npm security vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Jest automated tests
        run: npm test

  continuous-deployment:
    name: CD - Deploy to AWS Elastic Beanstalk
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          zip -r deploy-package.zip . -x "*.git*" ".elasticbeanstalk/*" "node_modules/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy to AWS Elastic Beanstalk
        run: |
          VERSION_LABEL="gh-${GITHUB_SHA::7}-$(date +%s)"
          aws s3 cp deploy-package.zip s3://elasticbeanstalk-us-east-1-524890435583/keepsake-greenops/${VERSION_LABEL}.zip
          aws elasticbeanstalk create-application-version \
            --application-name project1 \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-1-524890435583",S3Key="keepsake-greenops/${VERSION_LABEL}.zip"
          aws elasticbeanstalk update-environment \
            --environment-name keepsake-greenops-env \
            --version-label "${VERSION_LABEL}"
